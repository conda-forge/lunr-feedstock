# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.1"
  python_check_max: "3.15"
  node_min: "24.22.1"
  node_max: "25"

package:
  name: lunr
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/lunr/lunr-${{ version }}.tar.gz
  sha256: 46721d6b532edd25222cf1c95576e917a029d2c886457609840d661bd4c340b6

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatch-fancy-pypi-readme >=22.8.0
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/lunr/**
      site_packages:
        - lunr/**
        - lunr-${{ version }}.dist-info/**
  - python:
      imports: lunr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - nltk
        - nodejs >=${{ node_min }},<${{ node_max }}
        - pytest-cov
        - pytest-timeout
        - python ${{ python_min }}.*
    script:
      file: run_test.py

about:
  license: MIT
  license_file: LICENSE
  summary: A Python implementation of Lunr.js
  description: |-
    This Python version of Lunr.js aims to bring the simple and powerful full
    text search capabilities into Python guaranteeing results as close as the
    original implementation as possible.
  homepage: https://pypi.org/project/lunr
  repository: https://github.com/yeraydiazdiaz/lunr.py
  documentation: https://lunr.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
